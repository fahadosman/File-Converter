name = "fileconverter"
compatibility_date = "2026-04-23"
main = "worker.js"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

# Secrets (wrangler secret put): PADDLE_API_KEY — API key for the matching PADDLE_ENV.
# APP_BASE_URL: origin used in Paddle checkout.url (must be allowlisted in Paddle). Override via secret if needed.
# Optional secrets: PADDLE_PRICE_ID (override catalog price).
[vars]
PADDLE_ENV = "live"
APP_BASE_URL = "https://filesconverter.org"
PADDLE_PRICE_ID = "pri_01kqpmbpz27fa1aa82dfkfywd5"
PADDLE_PRODUCT_ID = "pro_01kqpm80qy2vgyb676wt1cwq5t"
